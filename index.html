<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doleo super te - Gestão de Colaboradores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <div class="container-logo">
            <!-- Logo estilizada via SVG: Cruz com Coroa no topo -->
            <svg class="logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://w3.org">
                <!-- Moldura circular sutil -->
                <circle cx="32" cy="32" r="30" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6"/>
                
                <!-- Coroa posta no topo da cruz -->
                <path d="M22 18L24.5 11L29 15.5L32 9L35 15.5L39.5 11L42 18H22Z" fill="#FFFFFF"/>
                <rect x="22" y="19.5" width="20" height="2" rx="1" fill="#FFFFFF"/>
                
                <!-- Cruz elegante -->
                <rect x="29.5" y="23.5" width="5" height="31.5" rx="1.5" fill="#FFFFFF"/>
                <rect x="19" y="32" width="26" height="5" rx="1.5" fill="#FFFFFF"/>
            </svg>

            <div class="identidade-texto">
                <h1>Doleo super te </h1>
                <span class="segmento">Serviços Funerários e Assistência Familiar</span>
            </div>
        </div>
    </header>

    <main class="container-principal">
        <section class="card-formulario">
            <h2>Cadastro de Colaborador</h2>
            <p class="subtitulo">Preencha os dados abaixo para registrar um novo membro na equipe.</p>

            <form id="formCadastro" novalidate>
                <!-- Dados Pessoais -->
                <fieldset class="grupo-campos">
                    <legend>Dados Pessoais</legend>
                    
                    <div class="campo">
                        <label for="nome">Nome Completo *</label>
                        <input type="text" id="nome" name="nome" placeholder="Ex: João da Silva" required>
                    </div>

                    <div class="campo">
                        <label for="endereco">Endereço Completo *</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro e cidade" required>
                    </div>

                    <div class="linha-dupla">
                        <div class="campo">
                            <label for="email">E-mail *</label>
                            <input type="email" id="email" name="email" placeholder="colaborador@paxserena.com.br" required>
                        </div>

                        <div class="campo">
                            <label for="telefone">Telefone *</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15" required>
                        </div>
                    </div>
                </fieldset>

                <!-- Dados Profissionais -->
                <fieldset class="grupo-campos">
                    <legend>Dados Profissionais</legend>

                    <div class="linha-dupla">
                        <div class="campo">
                            <label for="cargo">Cargo *</label>
                            <select id="cargo" name="cargo" required>
                                <option value="" disabled selected>Selecione um cargo...</option>
                                <option value="Atendente">Atendente</option>
                                <option value="Financeiro">Financeiro</option>
                                <option value="Traslado">Traslado</option>
                                <option value="Preparação dos Corpos">Preparação dos Corpos</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="salario">Salário (R$) *</label>
                            <input type="text" id="salario" name="salario" placeholder="R$ 0,00" required>
                        </div>
                    </div>

                    <div class="campo">
                        <label class="label-turno">Turno de Trabalho *</label>
                        <div class="opcoes-turno">
                            <label class="radio-label">
                                <input type="radio" name="turno" value="Manhã" required>
                                <span>Manhã</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="turno" value="Tarde">
                                <span>Tarde</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="turno" value="Noite (Plantão)">
                                <span>Noite (Plantão)</span>
                            </label>
                        </div>
                    </div>
                </fieldset>

                <button type="submit" class="btn-cadastrar">Cadastrar Funcionário</button>
            </form>

            <!-- Mensagem de feedback e resumo -->
            <div id="mensagemFeedback" class="feedback oculto"></div>
        </section>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 Doleo Super te Serviços Funerários. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
